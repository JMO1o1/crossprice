[project]
name = "crossprice"
version = "0.1.0"
description = "Cross-validated option pricing: analytic Black-Scholes-Merton, CRR binomial, and Monte Carlo methods that must agree, with quantified error."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Joshua M. O'Connor" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
crossprice-crossvalidate = "crossprice.crossvalidate:main"

[project.optional-dependencies]
plots = [
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossprice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: convergence tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = [
    "RUF002",  # ambiguous unicode in docstrings (we use en dashes and Greek letters deliberately)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
